name: Publish 0.1.0
on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful CI run for this exact main revision
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: frayproof-publish-0.1.0
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require the complete CI gate for this source
        uses: actions/github-script@v7
        env:
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        with:
          script: |
            const run_id = Number(process.env.CI_RUN_ID);
            if (!Number.isSafeInteger(run_id) || run_id <= 0) throw new Error('Invalid CI run ID');
            const repo = {owner: context.repo.owner, repo: context.repo.repo};
            const {data: run} = await github.rest.actions.getWorkflowRun({...repo, run_id});
            if (run.head_sha !== context.sha || run.head_branch !== 'main' ||
                run.path.split('@')[0] !== '.github/workflows/ci.yml' ||
                run.event !== 'push' || run.status !== 'completed' || run.conclusion !== 'success') {
              throw new Error('CI must pass on this exact main revision');
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {...repo, run_id, filter: 'latest'});
            const expected = new Set(['distributions']);
            for (const os of ['ubuntu', 'windows']) for (const py of ['3.12', '3.13', '3.14']) expected.add(`test (${os}-latest, ${py})`);
            if (jobs.length !== expected.size || new Set(jobs.map(j => j.name)).size !== expected.size ||
                jobs.some(j => !expected.has(j.name) || j.status !== 'completed' || j.conclusion !== 'success')) {
              throw new Error('All six platform jobs and packaging must pass');
            }
      - uses: actions/download-artifact@v4
        with:
          name: frayproof-distributions
          path: dist
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check release artifacts
        run: |
          python -m pip install twine
          python -m twine check --strict dist/*
          python - <<'PY'
          from pathlib import Path
          import tomllib
          import zipfile
          from email.parser import BytesParser
          assert tomllib.loads(Path('pyproject.toml').read_text())['project']['version'] == '0.1.0'
          assert {p.name for p in Path('dist').iterdir()} == {'frayproof-0.1.0-py3-none-any.whl', 'frayproof-0.1.0.tar.gz'}
          with zipfile.ZipFile('dist/frayproof-0.1.0-py3-none-any.whl') as wheel:
              metadata = BytesParser().parsebytes(wheel.read('frayproof-0.1.0.dist-info/METADATA'))
              assert metadata['Name'] == 'frayproof' and metadata['Version'] == '0.1.0'
          PY

  pypi:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/frayproof/
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frayproof-distributions
          path: dist
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}
      - name: Publish verified artifacts to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frayproof-distributions
          path: dist
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}
      - name: Publish GitHub release and matching files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0 dist/* --target "$GITHUB_SHA" --title "Frayproof 0.1.0" --notes-file docs/RELEASE_NOTES_0.1.0.md
