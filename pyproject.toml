[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "frayproof"
version = "0.1.0"
description = "Deterministic contracts for AI conversation context transformations"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["agents", "context", "compaction", "validation", "contracts"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
]
dependencies = ["pydantic>=2.7,<3", "PyYAML>=6.0.1,<7", "typer>=0.16,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "hypothesis>=6,<7", "pytest-cov>=5,<8", "ruff>=0.9,<1", "build>=1,<2", "twine>=6,<8"]

[project.scripts]
frayproof = "frayproof.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/frayproof"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/fixtures", "/examples", "/docs", "/.github", "/README.md", "/LICENSE", "/pyproject.toml", "/CHANGELOG.md", "/CONTRIBUTING.md", "/PRIOR_ART.md", "/.gitignore", "/.gitattributes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["frayproof"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
